# This machine's layer: the macmini behind a Cloudflare tunnel.
#
# Production serves the built frontend as static files, so the Vite dev server
# is parked behind the "dev" profile and does not start here. For local
# development with hot reload, bring it up explicitly:
#
#   docker compose --profile dev up -d
#
# and point the nginx mount below back at docker/nginx/default.conf.

services:
  nginx:
    ports: !override
      - "8080:80"
    volumes: !override
      - ./docker/nginx/tunnel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/html:ro
      - ./backend/public:/var/www/backend/public
      - ./backend/storage/app/public:/var/www/backend/storage/app/public:ro
    depends_on: !override
      - php

  # Not started in production — see the profile note above
  frontend:
    profiles:
      - dev
    ports: !override
      - "5174:5173"
    environment:
      - VITE_API_URL=/api/v1
      - CHOKIDAR_USEPOLLING=false

  mysql:
    ports: !override
      - "3306:3306"
