version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: puzo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "7710:7710"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/var/www/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - php
      - phpmyadmin
    networks:
      - puzo_network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: puzo_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.prod.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - CONTAINER_ROLE=app
    depends_on:
      - mysql
      - redis
    networks:
      - puzo_network

  mysql:
    image: mysql:8.0
    container_name: puzo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.prod.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - puzo_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: puzo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - puzo_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: puzo_queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - CONTAINER_ROLE=queue
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - mysql
      - redis
    networks:
      - puzo_network
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: puzo_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - CONTAINER_ROLE=scheduler
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - mysql
      - redis
    networks:
      - puzo_network
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: puzo_phpmyadmin
    restart: unless-stopped
    # Port exposed through nginx proxy on 7710
    expose:
      - "80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_ARBITRARY=1
    depends_on:
      - mysql
    networks:
      - puzo_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  puzo_network:
    driver: bridge
