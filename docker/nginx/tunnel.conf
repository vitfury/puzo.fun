# Production origin, reached only through the Cloudflare tunnel.
#
# The difference from default.conf is location / : there is no Vite dev server
# here, so the built bundle in /var/www/html is served as static files. Nothing
# under frontend/src is reachable. TLS is terminated at the Cloudflare edge, so
# this listens on plain HTTP.

upstream backend {
    server php:9000;
}

server {
    listen 80;
    server_name localhost puzo.fun www.puzo.fun;

    client_max_body_size 100M;

    root /var/www/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Backend API
    location /api/ {
        fastcgi_pass backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Laravel static files
    location /storage {
        alias /var/www/backend/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Standalone static lab page (served directly, bypassing the React app)
    location = /lab {
        alias /var/www/backend/public/diagram-of-the-approaching-death.html;
        default_type text/html;
    }

    # Preserve existing links while keeping /lab as the canonical URL.
    location = /diagram-of-the-approaching-death {
        return 301 https://$host/lab$is_args$args;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Vite hashes asset filenames, so a name change is the only way their
    # contents change — safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # The entry point must never be cached, or a deploy ships stale asset refs.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: real files win, everything else renders the app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to sensitive dotfiles (but allow .well-known, etc.)
    location ~ /\.(env|git|htaccess|htpasswd|DS_Store)(/|$) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
