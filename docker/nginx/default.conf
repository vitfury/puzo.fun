upstream frontend {
    server frontend:5173;
}

upstream backend {
    server php:9000;
}

server {
    listen 80;
    server_name localhost puzo.fun www.puzo.fun;

    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend proxy (React dev server)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for hot reload
        proxy_read_timeout 86400;
    }

    # Backend API
    location /api/ {
        fastcgi_pass backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Laravel static files
    location /storage {
        alias /var/www/backend/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Standalone static dashboard (served directly, bypassing the React/Vite app)
    location = /diagram-of-the-approaching-death {
        alias /var/www/backend/public/diagram-of-the-approaching-death.html;
        default_type text/html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Deny access to sensitive dotfiles (but allow .vite, .well-known, etc.)
    location ~ /\.(env|git|htaccess|htpasswd|DS_Store)(/|$) {
        deny all;
        access_log off;
        log_not_found off;
    }
}

