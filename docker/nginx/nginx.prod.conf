user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Map to check if version query parameter exists
    map $args $has_version {
        default 0;
        ~v= 1;
    }

    # HTTP to HTTPS redirect!!
    server {
        listen 80;
        server_name puzo.fun www.puzo.fun;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name puzo.fun www.puzo.fun;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/puzo.fun/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/puzo.fun/privkey.pem;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        root /var/www/html;
        index index.html;

        # API routes
        location /api/ {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM for Laravel
        location ~ \.php$ {
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }

        # Storage files
        location /storage/ {
            alias /var/www/html/storage/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # No-cache for index.html to prevent caching issues
        # Version will be added as query parameter via rewrite if not present
        location = /index.html {
            # Add version query parameter if not present
            # Version is read from .version file by deployment script
            # and injected into nginx config via sed/replace
            if ($has_version = 0) {
                # This will be replaced by deployment script with actual version
                # For now, just serve without version - deployment script will update this
                rewrite ^(.*)$ $1?v=BUILD_VERSION? permanent;
            }
        }

        # Static files from React build
        location / {
            try_files $uri $uri/ /index.html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Cache static assets (excluding JS and CSS which are handled above)
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}
