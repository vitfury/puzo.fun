version: '3.8'

# This file is for initial project setup only
# Run: docker-compose -f docker-compose.init.yml up

services:
  # Laravel installer
  laravel-install:
    image: composer:latest
    container_name: melody_ninja_laravel_install
    working_dir: /app
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        if [ ! -f composer.json ]; then
          echo 'Installing Laravel...'
          composer create-project laravel/laravel . --prefer-dist
          echo 'Laravel installed successfully!'
        else
          echo 'Laravel already installed, running composer install...'
          composer install
        fi
      "

  # React installer
  react-install:
    image: node:20-alpine
    container_name: melody_ninja_react_install
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      sh -c "
        if [ ! -f package.json ]; then
          echo 'Creating React + Vite project...'
          npm create vite@latest . -- --template react
          npm install
          echo 'React project created successfully!'
        else
          echo 'React project already exists, running npm install...'
          npm install
        fi
      "
