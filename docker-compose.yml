services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: melody_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public:/var/www/backend/public
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
      - frontend
    networks:
      - melody_network

  # PHP-FPM Service
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: melody_php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/frontend
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-melody_ninja}
      - DB_USERNAME=${DB_USERNAME:-melody_user}
      - DB_PASSWORD=${DB_PASSWORD:-melody_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - melody_network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: melody_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-melody_ninja}
      MYSQL_USER: ${DB_USERNAME:-melody_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-melody_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - melody_network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: melody_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - melody_network

  # Laravel Queue Worker
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: melody_queue
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-melody_ninja}
      - DB_USERNAME=${DB_USERNAME:-melody_user}
      - DB_PASSWORD=${DB_PASSWORD:-melody_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - php
      - mysql
      - redis
    networks:
      - melody_network
    restart: unless-stopped

  # Laravel Scheduler
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: melody_scheduler
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-melody_ninja}
      - DB_USERNAME=${DB_USERNAME:-melody_user}
      - DB_PASSWORD=${DB_PASSWORD:-melody_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - php
      - mysql
      - redis
    networks:
      - melody_network
    restart: unless-stopped

  # React Frontend with Hot Reload
  frontend:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: melody_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost/api/v1
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
    networks:
      - melody_network

networks:
  melody_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  node_modules:
    driver: local
