services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: melody_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public:/var/www/backend/public
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
      - frontend
    networks:
      - melody_network
    restart: unless-stopped

  # PHP-FPM Service
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: melody_php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./frontend:/var/www/frontend
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-puzo_fun}
      - DB_USERNAME=${DB_USERNAME:-melody_user}
      - DB_PASSWORD=${DB_PASSWORD:-melody_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Queue is unused (no Job classes / dispatch calls). Run inline,
      # so no dedicated worker is needed. Add a worker + switch to redis
      # if/when real queued jobs are introduced.
      - QUEUE_CONNECTION=sync
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - melody_network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: melody_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-puzo_fun}
      MYSQL_USER: ${DB_USERNAME:-melody_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-melody_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - melody_network
    restart: unless-stopped

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: melody_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - melody_network
    restart: unless-stopped

  # Laravel Scheduler
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: melody_scheduler
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction &
        sleep 60
      done"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-puzo_fun}
      - DB_USERNAME=${DB_USERNAME:-melody_user}
      - DB_PASSWORD=${DB_PASSWORD:-melody_pass}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=sync
    depends_on:
      - php
      - mysql
      - redis
    networks:
      - melody_network
    restart: unless-stopped

  # React Frontend with Hot Reload
  frontend:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: melody_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost/api/v1
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev"
    networks:
      - melody_network
    restart: unless-stopped

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: melody_phpmyadmin
    ports:
      - "7710:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_ARBITRARY=1
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - melody_network
    restart: unless-stopped

networks:
  melody_network:
    driver: bridge

volumes:
  mysql_data:
    name: musicninja_mysql_data
    external: true
  redis_data:
    name: musicninja_redis_data
    external: true
  node_modules:
    name: puzo_node_modules
    driver: local
