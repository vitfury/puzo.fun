name: Deploy to DigitalOcean

on:
  push:
    branches:
      - master  # Deploy on push to master
      - main    # Deploy on push to main (if using main instead of master)
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Validate Configuration
        run: |
          if [ -z "${{ vars.DO_HOST || secrets.DO_HOST }}" ]; then
            echo "❌ Error: DO_HOST is missing!"
            echo "   Додайте DO_HOST як Variable або Secret в GitHub:"
            echo "   Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "${{ vars.DO_USERNAME || secrets.DO_USERNAME }}" ]; then
            echo "❌ Error: DO_USERNAME is missing!"
            echo "   Додайте DO_USERNAME як Variable або Secret"
            exit 1
          fi
          if [ -z "${{ secrets.DO_SSH_KEY }}" ]; then
            echo "❌ Error: DO_SSH_KEY secret is missing!"
            echo "   DO_SSH_KEY має бути Secret (не Variable)!"
            exit 1
          fi
          echo "✅ All configuration is set"

      - name: 🚀 Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.DO_HOST || secrets.DO_HOST }}
          username: ${{ vars.DO_USERNAME || secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ vars.DO_SSH_PORT || secrets.DO_SSH_PORT || 22 }}
          script_timeout: 30m
          script: |
            set -e
            echo "========================================="
            echo "🚀 Starting Deployment"
            echo "========================================="

            cd /var/www/puzo.fun

            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            echo "🛑 Stopping containers..."
            docker-compose -f docker-compose.prod.yml down

            echo "🏗️ Building Docker images..."
            docker-compose -f docker-compose.prod.yml build --no-cache php queue scheduler

            echo "📦 Installing backend dependencies..."
            docker-compose -f docker-compose.prod.yml run --rm php composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗄️ Running migrations..."
            docker-compose -f docker-compose.prod.yml up -d mysql redis
            sleep 10
            docker-compose -f docker-compose.prod.yml run --rm php php artisan migrate --force

            echo "🎨 Building frontend..."
            cd frontend
            npm ci
            npm run build
            cd ..

            echo "♻️ Clearing caches..."
            docker-compose -f docker-compose.prod.yml run --rm php php artisan config:clear
            docker-compose -f docker-compose.prod.yml run --rm php php artisan cache:clear
            docker-compose -f docker-compose.prod.yml run --rm php php artisan route:clear
            docker-compose -f docker-compose.prod.yml run --rm php php artisan view:clear

            echo "🚀 Starting all services..."
            docker-compose -f docker-compose.prod.yml up -d

            echo "🧹 Cleaning up..."
            docker system prune -f

            echo "⏳ Waiting for services..."
            sleep 5

            echo "✅ Deployment complete!"
            docker-compose -f docker-compose.prod.yml ps

      - name: 🧪 Test Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.DO_HOST || secrets.DO_HOST }}
          username: ${{ vars.DO_USERNAME || secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ vars.DO_SSH_PORT || secrets.DO_SSH_PORT || 22 }}
          script: |
            echo "Testing API health endpoint..."
            sleep 3
            if curl -sSf -k https://puzo.fun/api/v1/health > /dev/null 2>&1; then
              echo "✅ Deployment successful - Site is accessible!"
              exit 0
            else
              echo "❌ Deployment failed - Site is not accessible!"
              cd /var/www/puzo.fun
              docker-compose -f docker-compose.prod.yml logs --tail=50 nginx php
              exit 1
            fi

      - name: 📢 Notify on Success
        if: success()
        run: |
          echo "🎉 Deployment to puzo.fun completed successfully!"
          echo "🌐 Site: https://puzo.fun"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

      - name: 📢 Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "Check the logs above for details."
