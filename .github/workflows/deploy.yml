name: Deploy to DigitalOcean

on:
  push:
    branches:
      - master  # Deploy on push to master
      - main    # Deploy on push to main (if using main instead of master)
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Validate Configuration
        run: |
          if [ -z "${{ vars.DO_HOST || secrets.DO_HOST }}" ]; then
            echo "❌ Error: DO_HOST is missing!"
            echo "   Додайте DO_HOST як Variable або Secret в GitHub:"
            echo "   Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "${{ vars.DO_USERNAME || secrets.DO_USERNAME }}" ]; then
            echo "❌ Error: DO_USERNAME is missing!"
            echo "   Додайте DO_USERNAME як Variable або Secret"
            exit 1
          fi
          if [ -z "${{ secrets.DO_SSH_KEY }}" ]; then
            echo "❌ Error: DO_SSH_KEY secret is missing!"
            echo "   DO_SSH_KEY має бути Secret (не Variable)!"
            exit 1
          fi
          echo "✅ All configuration is set"

      - name: 🚀 Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.DO_HOST || secrets.DO_HOST }}
          username: ${{ vars.DO_USERNAME || secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ vars.DO_SSH_PORT || secrets.DO_SSH_PORT || 22 }}
          script_timeout: 30m
          script: |
            set -e
            echo "========================================="
            echo "🚀 Starting Fast Deployment"
            echo "========================================="

            cd /var/www/puzo.fun

            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            # Запускаємо базу даних (якщо не запущена)
            echo "🗄️ Ensuring database is running..."
            docker-compose -f docker-compose.prod.yml up -d mysql redis
            sleep 5

            # Docker build БЕЗ --no-cache (використовує кеш, швидше в 10 разів!)
            # Перебілдиться тільки якщо змінився Dockerfile
            echo "🏗️ Building Docker images (with cache)..."
            docker-compose -f docker-compose.prod.yml build php queue scheduler || true

            # Composer install (швидко, використовує кеш vendor/)
            echo "📦 Installing backend dependencies..."
            docker-compose -f docker-compose.prod.yml run --rm php composer install --no-dev --optimize-autoloader --no-interaction

            # Міграції
            echo "🗄️ Running migrations..."
            docker-compose -f docker-compose.prod.yml run --rm php php artisan migrate --force

            # Frontend build з обмеженням пам'яті для малих серверів (1GB RAM)
            echo "🎨 Building frontend (with memory optimization)..."
            cd frontend
            npm install  # Швидше ніж npm ci, використовує кеш
            
            # Збільшуємо heap size для Node.js (512MB з 1GB доступної пам'яті)
            # Це дозволяє Node.js використовувати більше пам'яті для компіляції
            export NODE_OPTIONS="--max-old-space-size=512"
            export NODE_ENV=production
            
            # Білдимо з оптимізаціями (source maps вимкнено в vite.config.ts для production)
            echo "Running TypeScript compilation and Vite build..."
            npm run build || {
              echo "❌ Build failed, trying with reduced memory..."
              # Якщо не вистачило пам'яті, спробуємо з меншим heap
              export NODE_OPTIONS="--max-old-space-size=384"
              npm run build
            }
            cd ..
            
            echo "♻️ Clearing caches..."
            docker-compose -f docker-compose.prod.yml run --rm php php artisan config:clear
            docker-compose -f docker-compose.prod.yml run --rm php php artisan cache:clear
            docker-compose -f docker-compose.prod.yml run --rm php php artisan route:clear
            docker-compose -f docker-compose.prod.yml run --rm php php artisan view:clear

            # Read version from file and inject into nginx config
            if [ -f frontend/dist/.version ]; then
                BUILD_VERSION=$(cat frontend/dist/.version)
                echo "📝 Found build version: $BUILD_VERSION"
                # Inject version into nginx config
                sed -i "s/BUILD_VERSION/$BUILD_VERSION/g" docker/nginx/nginx.prod.conf
                echo "✅ Injected version $BUILD_VERSION into nginx config"
            else
                echo "⚠️  No .version file found, using timestamp as fallback"
                BUILD_VERSION=$(date +%s)
                sed -i "s/BUILD_VERSION/$BUILD_VERSION/g" docker/nginx/nginx.prod.conf
            fi

            # Перезапускаємо тільки потрібні сервіси (не всі!)
            # Nginx буде перезапущений і підтягне новий конфіг з версією
            echo "🚀 Restarting services..."
            docker-compose -f docker-compose.prod.yml up -d --no-deps php queue scheduler nginx
            
            # Перезавантажуємо nginx конфіг без перезапуску контейнера (якщо можливо)
            echo "🔄 Reloading nginx configuration..."
            docker-compose -f docker-compose.prod.yml exec -T nginx nginx -s reload 2>/dev/null || echo "⚠️  Nginx reload failed, container will restart with new config"

            echo "⏳ Waiting for services..."
            sleep 3

            echo "✅ Deployment complete!"
            docker-compose -f docker-compose.prod.yml ps

      - name: 🧪 Test Deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.DO_HOST || secrets.DO_HOST }}
          username: ${{ vars.DO_USERNAME || secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ vars.DO_SSH_PORT || secrets.DO_SSH_PORT || 22 }}
          script: |
            echo "Testing API health endpoint..."
            sleep 3
            if curl -sSf -k https://puzo.fun/api/v1/health > /dev/null 2>&1; then
              echo "✅ Deployment successful - Site is accessible!"
              exit 0
            else
              echo "❌ Deployment failed - Site is not accessible!"
              cd /var/www/puzo.fun
              docker-compose -f docker-compose.prod.yml logs --tail=50 nginx php
              exit 1
            fi

      - name: 📢 Notify on Success
        if: success()
        run: |
          echo "🎉 Deployment to puzo.fun completed successfully!"
          echo "🌐 Site: https://puzo.fun"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"

      - name: 📢 Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "Check the logs above for details."
